name: Apply nearby navigation refactor

on:
  push:
    branches:
      - agent/fix-nearby-auto-preview-back

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: stage clean nearby navigation refactor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-nearby-auto-preview-back
          fetch-depth: 0
      - name: Restore superseded files from main
        run: |
          git fetch origin main
          git checkout origin/main -- \
            web/map/history-state.ts \
            web/map/history-state.test.ts \
            web/map/nearby-results-state.ts \
            web/map/nearby-results-state.test.ts
          git rm -f web/map/nearby-auto-preview-history.ts test/e2e/map-auto-preview-back.spec.ts
      - name: Apply explicit preview-source refactor
        run: |
          python <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old!r}')
              file.write_text(text.replace(old, new))

          replace_once(
              'web/map/main.ts',
              "import { createNearbyPlacesController } from './nearby-places-controller'",
              "import { createNearbyPlacesController, type NearbyPreviewSource } from './nearby-places-controller'",
          )
          replace_once(
              'web/map/main.ts',
              "  onStart: ({ cityCode, origin, autoPreview }) => {\n    if (!autoPreview) {",
              "  onStart: ({ cityCode, origin, previewSource }) => {\n    if (!previewSource) {",
          )
          replace_once(
              'web/map/main.ts',
              "  onPlaces: (presentation) => {\n    if (presentation.autoPreview) enterNearbyView(presentation.origin[0], presentation.origin[1])",
              "  onPlaces: (presentation) => {\n    if (presentation.previewSource) enterNearbyView(presentation.origin[0], presentation.origin[1])",
          )
          replace_once(
              'web/map/main.ts',
              "  onAutoPreview: async (place, presentation) => {\n    nearbyResults.storeAndRenderMap(presentation)\n    await openAutoPreviewPlace(place)\n  },",
              "  onAutoPreview: async (place, presentation) => {\n    nearbyResults.storeAndRenderMap(presentation)\n    if (presentation.previewSource === 'map') {\n      enterNearbyView(presentation.origin[0], presentation.origin[1])\n    }\n    await openAutoPreviewPlace(place)\n  },",
          )
          replace_once(
              'web/map/main.ts',
              "  onError: ({ cityCode, origin, autoPreview, error }) => {\n    if (autoPreview) {",
              "  onError: ({ cityCode, origin, previewSource, error }) => {\n    if (previewSource) {",
          )
          replace_once(
              'web/map/main.ts',
              "      onRetry: () => void findNearbyPlaces(origin[0], origin[1], autoPreview, 'replace'),",
              "      onRetry: () => void findNearbyPlaces(origin[0], origin[1], previewSource, 'replace'),",
          )
          replace_once(
              'web/map/main.ts',
              "  onStopSelect: (latitude, longitude) => void findNearbyPlaces(latitude, longitude, true),",
              "  onStopSelect: (latitude, longitude) => void findNearbyPlaces(latitude, longitude, 'route-stop'),",
          )
          replace_once(
              'web/map/main.ts',
              "          await findNearbyPlaces(latitude, longitude, false, 'replace')",
              "          await findNearbyPlaces(latitude, longitude, undefined, 'replace')",
          )
          replace_once(
              'web/map/main.ts',
              "    void findNearbyPlaces(pick.place.latitude, pick.place.longitude, true)",
              "    void findNearbyPlaces(pick.place.latitude, pick.place.longitude, 'map')",
          )
          replace_once(
              'web/map/main.ts',
              "  if (map.getZoom() >= 14) void findNearbyPlaces(event.latlng.lat, event.latlng.lng, true)",
              "  if (map.getZoom() >= 14) void findNearbyPlaces(event.latlng.lat, event.latlng.lng, 'map')",
          )
          replace_once(
              'web/map/main.ts',
              "  autoPreview = false,\n  historyMode: 'push' | 'replace' = 'push',",
              "  previewSource: NearbyPreviewSource | undefined = undefined,\n  historyMode: 'push' | 'replace' = 'push',",
          )
          replace_once(
              'web/map/main.ts',
              "  if (!autoPreview) enterNearbyView(latitude, longitude, historyMode)",
              "  if (!previewSource) enterNearbyView(latitude, longitude, historyMode)",
          )
          replace_once(
              'web/map/main.ts',
              "    autoPreview,\n  })",
              "    previewSource,\n  })",
          )

          replace_once(
              'web/map/nearby-places-controller.ts',
              "export type NearbyPlacesRequest = {",
              "export type NearbyPreviewSource = 'map' | 'route-stop'\n\nexport type NearbyPlacesRequest = {",
          )
          replace_once(
              'web/map/nearby-places-controller.ts',
              "  autoPreview: boolean",
              "  previewSource?: NearbyPreviewSource",
          )
          replace_once(
              'web/map/nearby-places-controller.ts',
              "      if (request.autoPreview && firstPlace) {",
              "      if (request.previewSource && firstPlace) {",
          )

          replace_once(
              'web/map/nearby-places-controller.test.ts',
              "    autoPreview: false,",
              "    previewSource: undefined,",
          )
          text = Path('web/map/nearby-places-controller.test.ts').read_text()
          if text.count("autoPreview: true") != 2:
              raise SystemExit('unexpected nearby controller autoPreview test count')
          Path('web/map/nearby-places-controller.test.ts').write_text(
              text.replace("autoPreview: true", "previewSource: 'map'")
          )

          replace_once(
              'web/map/main-size.test.ts',
              "expect(mainSource).toContain(\"onRetry: () => void findNearbyPlaces(origin[0], origin[1], autoPreview, 'replace')\")",
              "expect(mainSource).toContain(\"onRetry: () => void findNearbyPlaces(origin[0], origin[1], previewSource, 'replace')\")\n    expect(mainSource).toContain(\"findNearbyPlaces(latitude, longitude, 'route-stop')\")\n    expect(mainSource).toContain(\"findNearbyPlaces(event.latlng.lat, event.latlng.lng, 'map')\")",
          )

          replace_once(
              'web/map/history-state.ts',
              "  const existingTrail = readMapDetailTrail(currentState)\n  const trail = currentView === nextView",
              "  const existingTrail = readMapDetailTrail(currentState)\n  const currentParent = readMapView({ mapView: historyRecord(currentState).mapParent })\n  const previousNearby = existingTrail.at(-1)\n  // A new map pick from an auto-previewed place replaces its old Nearby waypoint.\n  // It must not create place → nearby → place loops in the compressed detail trail.\n  if (\n    currentView === 'place'\n    && currentParent === 'nearby'\n    && nextView === 'nearby'\n    && previousNearby?.view === 'nearby'\n  ) {\n    return {\n      mode: 'replace',\n      state: withMapDetailTrail({\n        ...next,\n        mapParent: readMapView({ mapView: previousNearby.state.mapParent }) ?? 'catalogue',\n      }, existingTrail.slice(0, -1)),\n    }\n  }\n\n  const trail = currentView === nextView",
          )

          replace_once(
              'web/map/history-state.test.ts',
              "  it('does not grow the detail trail when replacing the same kind of detail', async () => {".replace('async ', ''),
              dedent("""
                it('replaces the previous nearby waypoint when a place starts a new nearby search', () => {
                  const current = {
                    mapView: 'place',
                    mapParent: 'nearby',
                    mapDetailTrail: [{
                      view: 'nearby',
                      url: '/map?city=Taipei&lat=25.00000&lon=121.50000',
                      state: { mapView: 'nearby', mapParent: 'catalogue' },
                    }],
                  }
                  const nearby = planMapHistoryPush(current, '/map?city=Taipei&place=P1', {
                    ...current,
                    mapView: 'nearby',
                    mapParent: 'place',
                  })
                  expect(nearby).toEqual({
                    mode: 'replace',
                    state: { mapView: 'nearby', mapParent: 'catalogue' },
                  })

                  const nextPlace = planMapHistoryPush(nearby.state, '/map?city=Taipei&lat=25.03300&lon=121.56500', {
                    ...nearby.state as Record<string, unknown>,
                    mapView: 'place',
                    mapParent: 'nearby',
                  })
                  expect(nextPlace).toEqual({
                    mode: 'replace',
                    state: {
                      mapView: 'place',
                      mapParent: 'nearby',
                      mapDetailTrail: [{
                        view: 'nearby',
                        url: '/map?city=Taipei&lat=25.03300&lon=121.56500',
                        state: { mapView: 'nearby', mapParent: 'catalogue' },
                      }],
                    },
                  })
                })

                it('does not grow the detail trail when replacing the same kind of detail', () => {
              """).rstrip(),
          )

          Path('test/e2e/map-auto-preview-navigation.spec.ts').write_text(dedent("""
            import { expect, test, type Page } from './fixtures'

            const city = { code: 'Tainan', name: '臺南', region: 'south', center: [22.997, 120.212] }
            const places = [
              { placeId: 'P1', name: '臺南火車站', latitude: 22.997, longitude: 120.212, distanceMeters: 76 },
              { placeId: 'P2', name: '成功大學', latitude: 22.999, longitude: 120.216, distanceMeters: 180 },
            ]

            function variant() {
              return {
                variantKey: 'TNN-15:0', routeName: '15', routeUid: 'TNN-15', direction: 0,
                label: '奇美醫院 → 大成路口', subRouteUid: 'TNN-15', subRouteName: '15', updatedAt: null,
                shape: { type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: [[120.2, 22.99], [120.24, 23.02]] } },
                stops: { type: 'FeatureCollection', features: [
                  { type: 'Feature', properties: { stopUid: 'S1', stopName: '奇美醫院', sequence: 1 }, geometry: { type: 'Point', coordinates: [120.2, 22.99] } },
                  { type: 'Feature', properties: { stopUid: 'S2', stopName: '大成路口', sequence: 2 }, geometry: { type: 'Point', coordinates: [120.24, 23.02] } },
                ] },
              }
            }

            function deferred() {
              let release!: () => void
              const promise = new Promise<void>((resolve) => { release = resolve })
              return { promise, release }
            }

            async function mockCommon(page: Page) {
              await page.route('https://tile.openstreetmap.org/**', (route) => route.fulfill({ status: 204 }))
              await page.route('**/api/v1/map/cities', (route) => route.fulfill({ json: { cities: [city] } }))
              await page.route(/\\/api\\/v1\\/map\\/routes(?:\\?|$)/, (route) => route.fulfill({ json: { routes: [{ routeName: '15', category: '數字' }] } }))
              await page.route(/\\/api\\/v1\\/map\\/route(?:\\?|$)/, (route) => route.fulfill({ json: { variants: [variant()] } }))
              await page.route('**/api/v1/map/timetable*', (route) => route.fulfill({ json: { timetable: { mode: 'none', services: [] } } }))
              await page.route('**/api/v1/map/vehicles*', (route) => route.fulfill({ json: { vehicles: [] } }))
              await page.route('**/api/v1/map/place/*/arrivals?city=Tainan', (route) => route.fulfill({ json: { routes: [] } }))
            }

            async function clickBlankMap(page: Page) {
              const point = await page.evaluate(() => {
                const map = document.getElementById('map')!
                const drawer = document.getElementById('map-drawer')!
                const mapBox = map.getBoundingClientRect()
                const drawerBox = drawer.getBoundingClientRect()
                for (const xRatio of [.85, .7, .55, .4, .25]) {
                  for (const yRatio of [.2, .35, .5, .65, .8]) {
                    const x = mapBox.left + mapBox.width * xRatio
                    const y = mapBox.top + mapBox.height * yRatio
                    if (x >= drawerBox.left && x <= drawerBox.right && y >= drawerBox.top && y <= drawerBox.bottom) continue
                    const target = document.elementFromPoint(x, y) as Element | null
                    if (!target?.closest('#map')) continue
                    if (target.closest('.leaflet-interactive, .leaflet-marker-icon, button, a')) continue
                    return { x, y }
                  }
                }
                throw new Error('no blank map point found')
              })
              await page.mouse.click(point.x, point.y)
            }

            test('catalogue map preview keeps the zoom gate and replaces an older nearby waypoint', async ({ page }) => {
              await page.setViewportSize({ width: 1440, height: 900 })
              await mockCommon(page)
              const firstGate = deferred()
              let nearbyRequests = 0
              await page.route(/\\/api\\/v1\\/map\\/nearby(?:\\?|$)/, async (route) => {
                nearbyRequests += 1
                if (nearbyRequests === 1) await firstGate.promise
                await route.fulfill({ json: { places: nearbyRequests === 1 ? [places[0], places[1]] : [places[1]] } })
              })

              await page.goto('/map?city=Tainan')
              const drawer = page.locator('#map-drawer')
              await expect(drawer.getByRole('heading', { name: city.name })).toBeVisible()

              await clickBlankMap(page)
              await expect(page.locator('#map-status')).toContainText('放大後再選站牌')
              expect(nearbyRequests).toBe(0)

              await clickBlankMap(page)
              await expect.poll(() => nearbyRequests).toBe(1)
              await expect(drawer.getByRole('heading', { name: city.name })).toBeVisible()
              await expect(drawer.getByRole('heading', { name: '附近站牌' })).toHaveCount(0)
              firstGate.release()

              await expect(drawer.getByRole('heading', { name: places[0].name })).toBeVisible()
              await expect(drawer.getByRole('button', { name: '← 附近站牌', exact: true })).toBeVisible()

              await clickBlankMap(page)
              await expect.poll(() => nearbyRequests).toBe(2)
              await expect(drawer.getByRole('heading', { name: places[1].name })).toBeVisible()
              await drawer.getByRole('button', { name: '← 附近站牌', exact: true }).click()
              await expect(drawer.getByRole('heading', { name: '附近站牌' })).toBeVisible()
              await expect(drawer.locator('.nearby-place-button')).toHaveCount(1)
              await drawer.getByRole('button', { name: '← 路線列表', exact: true }).click()
              await expect(page).toHaveURL('/map?city=Tainan')
            })

            test('blank map selection from a route returns through Nearby and then the route', async ({ page }) => {
              await page.setViewportSize({ width: 1440, height: 900 })
              await mockCommon(page)
              await page.route(/\\/api\\/v1\\/map\\/nearby(?:\\?|$)/, (route) => route.fulfill({ json: { places } }))

              await page.goto('/map?city=Tainan&route=15&variant=TNN-15%3A0')
              const drawer = page.locator('#map-drawer')
              await expect(drawer.getByRole('heading', { name: '15' })).toBeVisible()
              await clickBlankMap(page)

              await expect(drawer.getByRole('heading', { name: places[0].name })).toBeVisible()
              await expect(drawer.getByRole('button', { name: '← 附近站牌', exact: true })).toBeVisible()
              await drawer.getByRole('button', { name: '← 附近站牌', exact: true }).click()
              await expect(drawer.getByRole('heading', { name: '附近站牌' })).toBeVisible()
              await expect(drawer.getByRole('button', { name: '← 返回路線', exact: true })).toBeVisible()
              await drawer.getByRole('button', { name: '← 返回路線', exact: true }).click()
              await expect(drawer.getByRole('heading', { name: '15' })).toBeVisible()
            })

            test('route-stop selection returns directly to the route', async ({ page }) => {
              await page.setViewportSize({ width: 1440, height: 900 })
              await mockCommon(page)
              await page.route(/\\/api\\/v1\\/map\\/nearby(?:\\?|$)/, (route) => route.fulfill({ json: { places } }))

              await page.goto('/map?city=Tainan&route=15&variant=TNN-15%3A0')
              const drawer = page.locator('#map-drawer')
              const routeStops = page.locator('.leaflet-stop-pane svg path.leaflet-interactive')
              await expect(routeStops).toHaveCount(2)
              await routeStops.first().click()

              await expect(drawer.getByRole('heading', { name: places[0].name })).toBeVisible()
              await expect(drawer.getByRole('button', { name: '← 返回路線', exact: true })).toBeVisible()
              await drawer.getByRole('button', { name: '← 返回路線', exact: true }).click()
              await expect(drawer.getByRole('heading', { name: '15' })).toBeVisible()
            })
          """).lstrip())
          PY
      - name: Commit refactor
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(map): pass explicit nearby preview source"
          git push origin HEAD:agent/fix-nearby-auto-preview-back
