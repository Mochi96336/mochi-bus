name: D1 read insights

on:
  workflow_dispatch:
  schedule:
    # 07:45 Asia/Taipei / 23:45 UTC: capture nearly one complete D1 quota day
    # before the 00:00 UTC reset. This reads analytics and does not execute SQL.
    - cron: '45 23 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/d1-read-insights.yml'
      - 'scripts/transit-snapshot/d1-read-insights.mjs'

concurrency:
  group: d1-read-insights
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  insights:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve D1 analytics credential availability
        id: analytics
        env:
          CLOUDFLARE_ANALYTICS_API_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_API_TOKEN }}
        shell: bash
        run: |
          if [[ -n "${CLOUDFLARE_ANALYTICS_API_TOKEN:-}" ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            {
              echo '## D1 read attribution'
              echo
              echo 'Skipped: `CLOUDFLARE_ANALYTICS_API_TOKEN` is not configured.'
              echo 'Configure a dedicated read-only Cloudflare Account Analytics token to enable this optional evidence workflow.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: steps.analytics.outputs.available == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: steps.analytics.outputs.available == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.analytics.outputs.available == 'true'
        run: npm ci
      - name: Resolve snapshot operation scope
        id: operation
        if: steps.analytics.outputs.available == 'true'
        run: node scripts/instance/operation-scope.mjs snapshot
      - name: Collect and sanitize D1 read attribution
        if: steps.analytics.outputs.available == 'true' && steps.operation.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ steps.operation.outputs.d1_database_id }}
          D1_INSIGHTS_REPORT_PATH: .transit-snapshot/d1-read-insights.json
        run: node scripts/transit-snapshot/d1-read-insights.mjs
      - name: Upload sanitized D1 read evidence
        if: ${{ always() && steps.analytics.outputs.available == 'true' && steps.operation.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: d1-read-insights
          path: .transit-snapshot/d1-read-insights.json
          if-no-files-found: warn
          retention-days: 7
