name: Reconcile merged reviewed instance bundle PR

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RECONCILE to verify one merged reviewed-bundle PR without deploying
        required: true
        type: string
      pull_request_number:
        description: Merged reviewed-instance-bundle PR number
        required: true
        type: string
      apply_run_id:
        description: Successful Apply reviewed instance bundle to Draft PR workflow run ID
        required: true
        type: string
      artifact_name:
        description: Exact instance-bundle-apply-* artifact name from that run
        required: true
        type: string
      expected_bundle_hash:
        description: Exact reviewed bundle SHA-256
        required: true
        type: string
      expected_artifact_hash:
        description: Exact reviewed artifact SHA-256
        required: true
        type: string
      expected_target_manifest_hash:
        description: Exact reviewed target manifest SHA-256
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: instance-bundle-apply-merge-reconciliation-${{ inputs.pull_request_number }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reconcile-apply-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - name: Validate immutable reconciliation inputs
        id: preflight
        env:
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
          INPUT_PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
          INPUT_APPLY_RUN_ID: ${{ inputs.apply_run_id }}
          INPUT_ARTIFACT_NAME: ${{ inputs.artifact_name }}
          INPUT_EXPECTED_BUNDLE_HASH: ${{ inputs.expected_bundle_hash }}
          INPUT_EXPECTED_ARTIFACT_HASH: ${{ inputs.expected_artifact_hash }}
          INPUT_EXPECTED_TARGET_MANIFEST_HASH: ${{ inputs.expected_target_manifest_hash }}
        run: node scripts/instance/reconcile-apply-merge.mjs --preflight
      - name: Download exact apply evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.preflight.outputs.artifact_name }}
          path: .generated/reconcile-apply-merge/download
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.preflight.outputs.apply_run_id }}
          digest-mismatch: error
      - name: Verify persisted apply evidence before GitHub API reads
        id: prepare
        env:
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
          INPUT_PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
          INPUT_APPLY_RUN_ID: ${{ inputs.apply_run_id }}
          INPUT_ARTIFACT_NAME: ${{ inputs.artifact_name }}
          INPUT_EXPECTED_BUNDLE_HASH: ${{ inputs.expected_bundle_hash }}
          INPUT_EXPECTED_ARTIFACT_HASH: ${{ inputs.expected_artifact_hash }}
          INPUT_EXPECTED_TARGET_MANIFEST_HASH: ${{ inputs.expected_target_manifest_hash }}
        run: node scripts/instance/reconcile-apply-merge.mjs --prepare
      - name: Collect immutable merged-PR, branch, commit and manifest evidence
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ steps.prepare.outputs.pull_request_number }}
          CONFIG_PATH: ${{ steps.prepare.outputs.config_path }}
          CURRENT_BRANCH: ${{ steps.prepare.outputs.current_branch }}
          CURRENT_SHA: ${{ steps.prepare.outputs.current_sha }}
          APPLY_RUN_ID: ${{ steps.prepare.outputs.apply_run_id }}
          REVIEW_RUN_ID: ${{ steps.prepare.outputs.review_run_id }}
        with:
          github-token: ${{ github.token }}
          retries: 2
          script: |
            const fs = await import('node:fs/promises')
            const owner = context.repo.owner
            const repo = context.repo.repo
            const repository = `${owner}/${repo}`
            const pullNumber = Number(process.env.PR_NUMBER)
            const configPath = process.env.CONFIG_PATH
            const currentBranch = process.env.CURRENT_BRANCH
            const currentSha = process.env.CURRENT_SHA
            const applyRunId = Number(process.env.APPLY_RUN_ID)
            const reviewRunId = Number(process.env.REVIEW_RUN_ID)
            const root = '.generated/reconcile-apply-merge/github'
            await fs.mkdir(root, { recursive: true, mode: 0o700 })

            const getPr = async () => (await github.rest.pulls.get({ owner, repo, pull_number: pullNumber })).data
            const getBranch = async () => (await github.rest.repos.getBranch({ owner, repo, branch: currentBranch })).data
            const prStart = await getPr()
            if (!prStart.merged || !prStart.merge_commit_sha) {
              throw new Error('The selected pull request is not merged')
            }
            const branchStart = await getBranch()
            if (branchStart.commit.sha !== currentSha) {
              throw new Error(`Dispatch branch moved before evidence collection: expected ${currentSha}, received ${branchStart.commit.sha}`)
            }

            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: pullNumber, per_page: 100 })
            const commits = await github.paginate(github.rest.pulls.listCommits, { owner, repo, pull_number: pullNumber, per_page: 100 })
            const headCommit = (await github.rest.repos.getCommit({ owner, repo, ref: prStart.head.sha })).data
            const mergeCommit = (await github.rest.repos.getCommit({ owner, repo, ref: prStart.merge_commit_sha })).data
            const comparison = (await github.rest.repos.compareCommitsWithBasehead({
              owner,
              repo,
              basehead: `${prStart.merge_commit_sha}...${currentSha}`,
            })).data
            const applyRun = (await github.rest.actions.getWorkflowRun({ owner, repo, run_id: applyRunId })).data
            const reviewRun = (await github.rest.actions.getWorkflowRun({ owner, repo, run_id: reviewRunId })).data

            const readManifest = async (ref) => {
              const response = await github.rest.repos.getContent({ owner, repo, path: configPath, ref })
              if (Array.isArray(response.data) || response.data.type !== 'file' || response.data.encoding !== 'base64') {
                throw new Error(`Expected ${configPath} at ${ref} to be one base64 file`)
              }
              return {
                schemaVersion: 1,
                type: response.data.type,
                path: response.data.path,
                sha: response.data.sha,
                size: response.data.size,
                encoding: response.data.encoding,
                content: response.data.content,
              }
            }

            const normalizePr = (pr) => ({
              schemaVersion: 1,
              repository,
              number: pr.number,
              state: pr.state,
              draft: pr.draft,
              merged: pr.merged,
              mergedAt: pr.merged_at,
              mergedBy: pr.merged_by?.login ?? null,
              mergeCommitSha: pr.merge_commit_sha,
              title: pr.title,
              body: pr.body ?? '',
              htmlUrl: pr.html_url,
              base: { ref: pr.base.ref, sha: pr.base.sha, repository: pr.base.repo.full_name },
              head: { ref: pr.head.ref, sha: pr.head.sha, repository: pr.head.repo?.full_name ?? null },
              changedFiles: pr.changed_files,
              commits: pr.commits,
              additions: pr.additions,
              deletions: pr.deletions,
            })
            const normalizeCommit = (commit) => ({
              schemaVersion: 1,
              sha: commit.sha,
              message: commit.commit.message,
              treeSha: commit.commit.tree.sha,
              parents: commit.parents.map((parent) => parent.sha),
              htmlUrl: commit.html_url,
            })
            const normalizeRun = (run) => ({
              schemaVersion: 1,
              repository: run.repository.full_name,
              id: run.id,
              runAttempt: run.run_attempt,
              name: run.name,
              event: run.event,
              status: run.status,
              conclusion: run.conclusion,
              headBranch: run.head_branch,
              headSha: run.head_sha,
              htmlUrl: run.html_url,
            })

            const [headManifest, mergeManifest, currentManifest] = await Promise.all([
              readManifest(prStart.head.sha),
              readManifest(prStart.merge_commit_sha),
              readManifest(currentSha),
            ])
            const prEnd = await getPr()
            const branchEnd = await getBranch()
            const startIdentity = normalizePr(prStart)
            const endIdentity = normalizePr(prEnd)
            if (JSON.stringify(startIdentity) !== JSON.stringify(endIdentity)) {
              throw new Error('Pull request metadata changed while reconciliation evidence was collected')
            }
            if (branchEnd.commit.sha !== branchStart.commit.sha || branchEnd.commit.sha !== currentSha) {
              throw new Error('Dispatch branch moved while reconciliation evidence was collected')
            }

            const evidence = {
              'pull-request.json': startIdentity,
              'branch.json': {
                schemaVersion: 1,
                repository,
                name: currentBranch,
                sha: branchEnd.commit.sha,
                protected: branchEnd.protected,
              },
              'files.json': {
                schemaVersion: 1,
                files: files.map((file) => ({
                  filename: file.filename,
                  status: file.status,
                  sha: file.sha,
                  additions: file.additions,
                  deletions: file.deletions,
                  changes: file.changes,
                  previousFilename: file.previous_filename ?? null,
                })),
              },
              'commits.json': {
                schemaVersion: 1,
                commits: commits.map((commit) => ({ sha: commit.sha })),
              },
              'head-commit.json': normalizeCommit(headCommit),
              'merge-commit.json': normalizeCommit(mergeCommit),
              'compare.json': {
                schemaVersion: 1,
                baseSha: prStart.merge_commit_sha,
                headSha: currentSha,
                status: comparison.status,
                aheadBy: comparison.ahead_by,
                behindBy: comparison.behind_by,
                totalCommits: comparison.total_commits,
                mergeBaseSha: comparison.merge_base_commit.sha,
              },
              'head-manifest.json': headManifest,
              'merge-manifest.json': mergeManifest,
              'current-manifest.json': currentManifest,
              'apply-run.json': normalizeRun(applyRun),
              'review-run.json': normalizeRun(reviewRun),
            }
            for (const [name, value] of Object.entries(evidence)) {
              await fs.writeFile(`${root}/${name}`, `${JSON.stringify(value, null, 2)}\n`, { encoding: 'utf8', mode: 0o600, flag: 'wx' })
            }
      - name: Compile current manifest into isolated evidence
        env:
          CONFIG_PATH: ${{ steps.prepare.outputs.config_path }}
        run: node scripts/instance/compile-config.mjs --config "$CONFIG_PATH" --out-dir .generated/reconcile-apply-merge/compiled
      - name: Reconcile merge, current manifest, generated files and local doctor
        id: reconcile
        env:
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
          INPUT_PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
          INPUT_APPLY_RUN_ID: ${{ inputs.apply_run_id }}
          INPUT_ARTIFACT_NAME: ${{ inputs.artifact_name }}
          INPUT_EXPECTED_BUNDLE_HASH: ${{ inputs.expected_bundle_hash }}
          INPUT_EXPECTED_ARTIFACT_HASH: ${{ inputs.expected_artifact_hash }}
          INPUT_EXPECTED_TARGET_MANIFEST_HASH: ${{ inputs.expected_target_manifest_hash }}
        run: node scripts/instance/reconcile-apply-merge.mjs --reconcile
      - name: Upload reconciliation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: instance-bundle-merge-reconciliation-${{ steps.prepare.outputs.instance_id || 'unknown' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .generated/reconcile-apply-merge/github
            .generated/reconcile-apply-merge/compiled
            .generated/reconcile-apply-merge/result
          if-no-files-found: warn
          retention-days: 30
