name: Release routes diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-routes-diagnostic.yml'
      - 'scripts/release-smoke/diagnose-routes.mjs'

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose production route catalogues
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .nvmrc
          check-latest: false

      - name: Diagnose bounded production route metadata
        run: node scripts/release-smoke/diagnose-routes.mjs
