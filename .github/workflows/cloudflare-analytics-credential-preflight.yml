name: Cloudflare Account Analytics credential preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-analytics-credential-preflight
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate manual credential preflight intent
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = 'refs/heads/main'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Probe Worker resource analytics access
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ANALYTICS_API_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_API_TOKEN }}
          CLOUDFLARE_ANALYTICS_PREFLIGHT_REPORT: .transit-snapshot/cloudflare-analytics-credential-preflight.json
        run: node scripts/transit-snapshot/cloudflare-analytics-credential-preflight.mjs
      - name: Upload bounded Account Analytics preflight evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cloudflare-analytics-credential-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: .transit-snapshot/cloudflare-analytics-credential-preflight.json
          if-no-files-found: warn
          retention-days: 14
          compression-level: 9
      - name: Require Cloudflare Account Analytics READY
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises'
          let report
          try {
            report = JSON.parse(await readFile('.transit-snapshot/cloudflare-analytics-credential-preflight.json', 'utf8'))
          } catch {
            console.error('Cloudflare Account Analytics preflight: NOT READY (report missing or invalid)')
            process.exit(1)
          }
          const ready = report?.schemaVersion === 1
            && report?.event === 'cloudflare_account_analytics_preflight'
            && report?.outcome === 'ready'
            && report?.ready === true
            && report?.dataset === 'workersInvocationsAdaptive'
            && report?.operationName === 'WorkerResourceMeasurement'
          if (!ready) {
            console.error(JSON.stringify({
              event: report?.event ?? null,
              outcome: report?.outcome ?? null,
              ready: report?.ready ?? false,
              httpStatus: report?.httpStatus ?? null,
              dataset: report?.dataset ?? null,
              operationName: report?.operationName ?? null,
              errorDetail: report?.errorDetail ?? null,
            }))
            console.error('Cloudflare Account Analytics preflight: NOT READY')
            process.exit(1)
          }
          console.log('Cloudflare Account Analytics preflight: READY')
          NODE
