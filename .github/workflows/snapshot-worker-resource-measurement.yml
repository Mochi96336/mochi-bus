name: Measure snapshot Worker resources

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type MEASURE_RESOURCES to deploy short-lived read-only measurement Workers
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: transit-snapshot
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Resolve snapshot resources
        id: operation
        run: node scripts/instance/operation-scope.mjs snapshot
      - name: Validate manual measurement scope
        shell: bash
        env:
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
          SNAPSHOT_ENABLED: ${{ steps.operation.outputs.enabled }}
          TRANSIT_DATABASE_ID: ${{ steps.operation.outputs.d1_database_id }}
          TRANSIT_R2_BUCKET_NAME: ${{ steps.operation.outputs.r2_bucket_name }}
          CLOUDFLARE_ANALYTICS_API_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_API_TOKEN }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = 'refs/heads/main'
          test "${INPUT_CONFIRMATION}" = 'MEASURE_RESOURCES'
          test "${SNAPSHOT_ENABLED}" = 'true'
          test -n "${TRANSIT_DATABASE_ID}"
          test -n "${TRANSIT_R2_BUCKET_NAME}"
          test -n "${CLOUDFLARE_ANALYTICS_API_TOKEN}"
          node scripts/instance/assert-operation-city.mjs Taipei
          node scripts/instance/assert-operation-city.mjs NewTaipei
          node scripts/instance/assert-operation-city.mjs Taichung
      - name: Build production bundle
        run: npm run build:map
      - name: Measure direct and transfer Worker resources
        shell: bash
        env:
          RESOURCE_MEASUREMENT_ROOT: ${{ runner.temp }}/snapshot-worker-resource-${{ github.run_id }}-${{ github.run_attempt }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_DEPLOY_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          CLOUDFLARE_ANALYTICS_API_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_API_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TRANSIT_DATABASE_ID: ${{ steps.operation.outputs.d1_database_id }}
          TRANSIT_R2_BUCKET_NAME: ${{ steps.operation.outputs.r2_bucket_name }}
        run: |
          set -euo pipefail
          set +x
          mkdir -p "${RESOURCE_MEASUREMENT_ROOT}/artifact"
          node scripts/transit-snapshot/measure-worker-resources.mjs \
            "${RESOURCE_MEASUREMENT_ROOT}/artifact/worker-resource-measurement.json" \
            "${RESOURCE_MEASUREMENT_ROOT}/cleanup-registry.json"
      - name: Cleanup temporary measurement Workers
        if: always()
        shell: bash
        env:
          RESOURCE_MEASUREMENT_ROOT: ${{ runner.temp }}/snapshot-worker-resource-${{ github.run_id }}-${{ github.run_attempt }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DEPLOY_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
        run: |
          set -euo pipefail
          set +x
          node scripts/transit-snapshot/measure-worker-resources.mjs \
            --cleanup-registry \
            "${RESOURCE_MEASUREMENT_ROOT}/cleanup-registry.json"
      - name: Summarize Worker resource evidence
        if: always()
        shell: bash
        env:
          RESOURCE_MEASUREMENT_ROOT: ${{ runner.temp }}/snapshot-worker-resource-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          report="${RESOURCE_MEASUREMENT_ROOT}/artifact/worker-resource-measurement.json"
          test -s "${report}" || exit 0
          node - "${report}" <<'NODE'
          const fs = require('node:fs')
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))
          const rows = []
          for (const city of report.cities ?? []) {
            for (const item of city.cases ?? []) {
              rows.push([
                city.city,
                item.kind,
                item.status,
                item.sample?.shardFanout ?? '-',
                item.analytics?.subrequests ?? '-',
                item.analytics?.subrequestsPerRequest?.toFixed?.(2) ?? '-',
                item.analytics?.memoryUsageBytes?.p50 ?? '-',
                item.analytics?.memoryUsageBytes?.p99 ?? '-',
                item.analytics?.memoryUsageBytes?.p999 ?? '-',
              ])
            }
          }
          const summary = [
            '## Snapshot Worker resource measurement',
            '',
            `- Source commit: \`${report.sourceCommit ?? 'unknown'}\``,
            `- Acceptance evidence: **${report.acceptanceEvidence ? 'yes' : 'no'}**`,
            '',
            '| city | path | status | transfer shard fanout | subrequests total | subrequests/request | memory P50 bytes | memory P99 bytes | memory P999 bytes |',
            '| --- | --- | --- | ---: | ---: | ---: | ---: | ---: | ---: |',
            ...rows.map((row) => `| ${row.join(' | ')} |`),
            '',
          ].join('\n')
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary)
          NODE
      - name: Upload Worker resource evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snapshot-worker-resource-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/snapshot-worker-resource-${{ github.run_id }}-${{ github.run_attempt }}/artifact
          if-no-files-found: warn
          retention-days: 14
          compression-level: 9
      - name: Cleanup measurement workspace
        if: always()
        shell: bash
        env:
          RESOURCE_MEASUREMENT_ROOT: ${{ runner.temp }}/snapshot-worker-resource-${{ github.run_id }}-${{ github.run_attempt }}
        run: rm -rf "${RESOURCE_MEASUREMENT_ROOT}"
