name: Snapshot high-card retirement readiness

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      # A merge that changes this proof should immediately capture the current
      # production boundary once. There is intentionally no recurring schedule.
      - '.github/workflows/snapshot-high-card-retirement-readiness.yml'
      - 'scripts/transit-snapshot/high-card-retirement-readiness.mjs'
      - 'scripts/transit-snapshot/high-card-retirement-readiness.test.mjs'
      - 'scripts/transit-snapshot/high-card-retirement-schema-inventory.mjs'
      - 'scripts/transit-snapshot/high-card-retirement-schema-inventory.test.mjs'
      - 'scripts/transit-snapshot/high-card-retirement-plan.mjs'
      - 'scripts/transit-snapshot/high-card-retirement-plan.test.mjs'
      - 'scripts/transit-snapshot/high-card-retirement-plan-report.mjs'
      - 'scripts/transit-snapshot/high-card-retirement-plan-report.test.mjs'

concurrency:
  group: snapshot-high-card-retirement-readiness
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Resolve snapshot operation scope
        id: operation
        run: node scripts/instance/operation-scope.mjs snapshot
      - name: Inventory legacy high-card D1 schema
        if: steps.operation.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TRANSIT_DATABASE_ID: ${{ steps.operation.outputs.d1_database_id }}
          SNAPSHOT_HIGH_CARD_SCHEMA_INVENTORY_REPORT: .transit-snapshot/high-card-retirement-schema-inventory.json
        run: node scripts/transit-snapshot/high-card-retirement-schema-inventory.mjs
      - name: Read legacy high-card retirement readiness
        if: steps.operation.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TRANSIT_DATABASE_ID: ${{ steps.operation.outputs.d1_database_id }}
          TRANSIT_R2_BUCKET_NAME: ${{ steps.operation.outputs.r2_bucket_name }}
          SNAPSHOT_HIGH_CARD_RETIREMENT_REPORT: .transit-snapshot/high-card-retirement-readiness.json
        run: node scripts/transit-snapshot/high-card-retirement-readiness.mjs
      - name: Build same-run non-destructive retirement plan
        if: steps.operation.outputs.enabled == 'true'
        env:
          SNAPSHOT_HIGH_CARD_SCHEMA_INVENTORY_REPORT: .transit-snapshot/high-card-retirement-schema-inventory.json
          SNAPSHOT_HIGH_CARD_RETIREMENT_REPORT: .transit-snapshot/high-card-retirement-readiness.json
          SNAPSHOT_HIGH_CARD_RETIREMENT_PLAN_REPORT: .transit-snapshot/high-card-retirement-plan.json
        run: node scripts/transit-snapshot/high-card-retirement-plan-report.mjs
      - name: Upload retirement readiness evidence
        if: ${{ always() && steps.operation.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-high-card-retirement-readiness
          path: |
            .transit-snapshot/high-card-retirement-readiness.json
            .transit-snapshot/high-card-retirement-schema-inventory.json
            .transit-snapshot/high-card-retirement-plan.json
          if-no-files-found: warn
          retention-days: 14
