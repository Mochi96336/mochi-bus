name: Verify reviewed instance bundle Draft PR

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type VERIFY to perform a read-only generated Draft PR verification
        required: true
        type: string
      pull_request_number:
        description: Generated reviewed-instance-bundle Draft PR number
        required: true
        type: string
      apply_run_id:
        description: Successful Apply reviewed instance bundle to Draft PR workflow run ID
        required: true
        type: string
      artifact_name:
        description: Exact instance-bundle-apply-* artifact name from that run
        required: true
        type: string
      expected_bundle_hash:
        description: Exact reviewed bundle SHA-256
        required: true
        type: string
      expected_artifact_hash:
        description: Exact reviewed artifact SHA-256
        required: true
        type: string
      expected_target_manifest_hash:
        description: Exact reviewed target manifest SHA-256
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: instance-bundle-apply-pr-verification-${{ inputs.pull_request_number }}-${{ inputs.apply_run_id }}
  cancel-in-progress: false

jobs:
  verify-apply-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - name: Validate immutable verification inputs
        id: preflight
        env:
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
          INPUT_PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
          INPUT_APPLY_RUN_ID: ${{ inputs.apply_run_id }}
          INPUT_ARTIFACT_NAME: ${{ inputs.artifact_name }}
          INPUT_EXPECTED_BUNDLE_HASH: ${{ inputs.expected_bundle_hash }}
          INPUT_EXPECTED_ARTIFACT_HASH: ${{ inputs.expected_artifact_hash }}
          INPUT_EXPECTED_TARGET_MANIFEST_HASH: ${{ inputs.expected_target_manifest_hash }}
        run: node scripts/instance/verify-apply-pr.mjs --preflight
      - name: Download exact apply evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.preflight.outputs.artifact_name }}
          path: .generated/verify-apply-pr/download
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.preflight.outputs.apply_run_id }}
          digest-mismatch: error
      - name: Verify persisted apply evidence before GitHub API reads
        id: prepare
        env:
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
          INPUT_PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
          INPUT_APPLY_RUN_ID: ${{ inputs.apply_run_id }}
          INPUT_ARTIFACT_NAME: ${{ inputs.artifact_name }}
          INPUT_EXPECTED_BUNDLE_HASH: ${{ inputs.expected_bundle_hash }}
          INPUT_EXPECTED_ARTIFACT_HASH: ${{ inputs.expected_artifact_hash }}
          INPUT_EXPECTED_TARGET_MANIFEST_HASH: ${{ inputs.expected_target_manifest_hash }}
        run: node scripts/instance/verify-apply-pr.mjs --prepare
      - name: Collect immutable PR, run, commit, manifest and CI evidence
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ steps.prepare.outputs.pull_request_number }}
          CONFIG_PATH: ${{ steps.prepare.outputs.config_path }}
          APPLY_RUN_ID: ${{ steps.prepare.outputs.apply_run_id }}
          REVIEW_RUN_ID: ${{ steps.prepare.outputs.review_run_id }}
        with:
          github-token: ${{ github.token }}
          retries: 2
          script: |
            const fs = await import('node:fs/promises')
            const path = await import('node:path')
            const owner = context.repo.owner
            const repo = context.repo.repo
            const repository = `${owner}/${repo}`
            const pullNumber = Number(process.env.PR_NUMBER)
            const configPath = process.env.CONFIG_PATH
            const applyRunId = Number(process.env.APPLY_RUN_ID)
            const reviewRunId = Number(process.env.REVIEW_RUN_ID)
            const root = '.generated/verify-apply-pr/github'
            const applyWorkflowPath = '.github/workflows/apply-instance-bundle-pr.yml'
            const reviewWorkflowPath = '.github/workflows/review-instance-bundle.yml'
            const ciWorkflowPath = '.github/workflows/ci.yml'
            await fs.mkdir(root, { recursive: true, mode: 0o700 })

            const getPr = async () => (await github.rest.pulls.get({ owner, repo, pull_number: pullNumber })).data
            const getWorkflow = async (workflowPath) => (await github.rest.actions.getWorkflow({
              owner,
              repo,
              workflow_id: workflowPath,
            })).data
            const prStart = await getPr()
            const [applyWorkflow, reviewWorkflow, ciWorkflow] = await Promise.all([
              getWorkflow(applyWorkflowPath),
              getWorkflow(reviewWorkflowPath),
              getWorkflow(ciWorkflowPath),
            ])
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: pullNumber, per_page: 100 })
            const commits = await github.paginate(github.rest.pulls.listCommits, { owner, repo, pull_number: pullNumber, per_page: 100 })
            const headCommit = (await github.rest.repos.getCommit({ owner, repo, ref: prStart.head.sha })).data
            const applyRun = (await github.rest.actions.getWorkflowRun({ owner, repo, run_id: applyRunId })).data
            const reviewRun = (await github.rest.actions.getWorkflowRun({ owner, repo, run_id: reviewRunId })).data
            const workflowFilePath = (run) => String(run?.path ?? '').split('@', 1)[0]
            const ciRuns = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner,
              repo,
              workflow_id: ciWorkflow.id,
              branch: prStart.head.ref,
              per_page: 100,
            })
            const formalCiRun = ciRuns
              .filter((run) => run.workflow_id === ciWorkflow.id && workflowFilePath(run) === ciWorkflowPath && run.head_sha === prStart.head.sha)
              .sort((left, right) => right.id - left.id)[0] ?? null

            const requireRunWorkflow = (run, workflow, workflowPath, label) => {
              if (run.workflow_id !== workflow.id || workflowFilePath(run) !== workflowPath) {
                throw new Error(`${label} run is not from ${workflowPath}#${workflow.id}`)
              }
              if (run.repository?.full_name !== repository || run.head_repository?.full_name !== repository) {
                throw new Error(`${label} run repository identity differs from ${repository}`)
              }
            }
            requireRunWorkflow(applyRun, applyWorkflow, applyWorkflowPath, 'Apply')
            requireRunWorkflow(reviewRun, reviewWorkflow, reviewWorkflowPath, 'Review')

            const readManifest = async (ref) => {
              const response = await github.rest.repos.getContent({ owner, repo, path: configPath, ref })
              if (Array.isArray(response.data) || response.data.type !== 'file' || response.data.encoding !== 'base64') {
                throw new Error(`Expected ${configPath} at ${ref} to be one base64 file`)
              }
              return {
                schemaVersion: 1,
                type: response.data.type,
                path: response.data.path,
                sha: response.data.sha,
                size: response.data.size,
                encoding: response.data.encoding,
                content: response.data.content,
              }
            }

            const normalizePr = (pr) => ({
              schemaVersion: 1,
              repository,
              number: pr.number,
              state: pr.state,
              draft: pr.draft,
              merged: pr.merged,
              mergeable: pr.mergeable,
              title: pr.title,
              body: pr.body ?? '',
              htmlUrl: pr.html_url,
              base: { ref: pr.base.ref, sha: pr.base.sha, repository: pr.base.repo.full_name },
              head: { ref: pr.head.ref, sha: pr.head.sha, repository: pr.head.repo?.full_name ?? null },
              changedFiles: pr.changed_files,
              commits: pr.commits,
              additions: pr.additions,
              deletions: pr.deletions,
            })
            const normalizePrIdentity = (pr) => {
              const { mergeable: _mergeable, ...identity } = normalizePr(pr)
              return identity
            }
            const normalizeRun = (run) => ({
              schemaVersion: 1,
              repository: run.repository.full_name,
              headRepository: run.head_repository?.full_name ?? null,
              workflowId: run.workflow_id,
              workflowPath: run.path,
              id: run.id,
              runAttempt: run.run_attempt,
              name: run.name,
              event: run.event,
              status: run.status,
              conclusion: run.conclusion,
              headBranch: run.head_branch,
              headSha: run.head_sha,
              htmlUrl: run.html_url,
            })
            const normalizeFormalCi = (run) => run === null ? null : ({
              schemaVersion: 1,
              workflowId: run.workflow_id,
              workflowPath: run.path,
              id: run.id,
              runAttempt: run.run_attempt,
              event: run.event,
              status: run.status,
              conclusion: run.conclusion,
              headBranch: run.head_branch,
              headSha: run.head_sha,
              htmlUrl: run.html_url,
            })

            const baseManifest = await readManifest(prStart.base.sha)
            const headManifest = await readManifest(prStart.head.sha)
            const prEnd = await getPr()
            const startIdentity = normalizePrIdentity(prStart)
            const endIdentity = normalizePrIdentity(prEnd)
            if (JSON.stringify(startIdentity) !== JSON.stringify(endIdentity)) {
              throw new Error('Pull request metadata changed while verification evidence was collected')
            }

            const formalCiCheckRuns = formalCiRun === null ? [] : [{
              name: `workflow:${ciWorkflowPath}`,
              status: formalCiRun.status,
              conclusion: formalCiRun.status === 'completed' && formalCiRun.conclusion === 'success' ? 'success' : formalCiRun.status === 'completed' ? 'failure' : null,
              detailsUrl: formalCiRun.html_url,
              appSlug: 'github-actions',
            }]
            const formalCiState = formalCiRun === null
              ? 'missing'
              : formalCiRun.status !== 'completed'
                ? 'pending'
                : formalCiRun.conclusion === 'success'
                  ? 'success'
                  : 'failed'

            const evidence = {
              'pull-request.json': normalizePr(prEnd),
              'files.json': {
                schemaVersion: 1,
                files: files.map((file) => ({
                  filename: file.filename,
                  status: file.status,
                  sha: file.sha,
                  additions: file.additions,
                  deletions: file.deletions,
                  changes: file.changes,
                  previousFilename: file.previous_filename ?? null,
                })),
              },
              'commits.json': {
                schemaVersion: 1,
                commits: commits.map((commit) => ({
                  sha: commit.sha,
                  message: commit.commit.message,
                  parents: commit.parents.map((parent) => parent.sha),
                })),
              },
              'head-commit.json': {
                schemaVersion: 1,
                sha: headCommit.sha,
                message: headCommit.commit.message,
                treeSha: headCommit.commit.tree.sha,
                parents: headCommit.parents.map((parent) => parent.sha),
              },
              'base-manifest.json': baseManifest,
              'head-manifest.json': headManifest,
              'apply-run.json': normalizeRun(applyRun),
              'review-run.json': normalizeRun(reviewRun),
              'checks.json': {
                schemaVersion: 1,
                formalCi: {
                  workflowId: ciWorkflow.id,
                  workflowPath: ciWorkflowPath,
                  state: formalCiState,
                  run: normalizeFormalCi(formalCiRun),
                },
                combinedState: formalCiState === 'failed' ? 'failure' : formalCiState === 'success' ? 'success' : 'pending',
                checkRuns: formalCiCheckRuns,
                statuses: [],
              },
            }
            for (const [name, value] of Object.entries(evidence)) {
              await fs.writeFile(path.join(root, name), `${JSON.stringify(value, null, 2)}\n`, { encoding: 'utf8', mode: 0o600, flag: 'wx' })
            }
      - name: Cross-check generated Draft PR against reviewed evidence
        id: verify
        env:
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
          INPUT_PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
          INPUT_APPLY_RUN_ID: ${{ inputs.apply_run_id }}
          INPUT_ARTIFACT_NAME: ${{ inputs.artifact_name }}
          INPUT_EXPECTED_BUNDLE_HASH: ${{ inputs.expected_bundle_hash }}
          INPUT_EXPECTED_ARTIFACT_HASH: ${{ inputs.expected_artifact_hash }}
          INPUT_EXPECTED_TARGET_MANIFEST_HASH: ${{ inputs.expected_target_manifest_hash }}
        run: node scripts/instance/verify-apply-pr.mjs --verify
      - name: Upload read-only verification evidence
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: instance-bundle-apply-pr-verification-${{ steps.preflight.outputs.pull_request_number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .generated/verify-apply-pr
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
          include-hidden-files: true
