name: Apply TDX copy update

on:
  push:
    branches:
      - agent/clarify-tdx-credential-copy

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/clarify-tdx-credential-copy
      - name: Update TDX credential copy
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "src/ui.ts": (
                  "向 <a href=\"https://tdx.transportdata.tw/\" target=\"_blank\" rel=\"noopener\">TDX</a> 申請一組自己的憑證，即時查詢就走你自己的額度。瀏覽器直接向 TDX 換取短效 token；查詢時 Worker 只收到 token，Client Secret 不會送進 Mochi Bus Worker。",
                  "可向 <a href=\"https://tdx.transportdata.tw/\" target=\"_blank\" rel=\"noopener\">TDX</a> 免費申請憑證，使用個人查詢額度。瀏覽器會直接向 TDX 取得短效 token，Mochi Bus Worker 不會收到 Client Secret。",
              ),
              "src/ui.test.ts": (
                  "expect(html).toContain('查詢時 Worker 只收到 token，Client Secret 不會送進 Mochi Bus Worker')",
                  "expect(html).toContain('Mochi Bus Worker 不會收到 Client Secret')",
              ),
          }

          for filename, (old, new) in replacements.items():
              path = Path(filename)
              content = path.read_text(encoding="utf-8")
              if old not in content:
                  raise SystemExit(f"Expected text not found in {filename}")
              path.write_text(content.replace(old, new, 1), encoding="utf-8")
      - name: Commit copy update
        run: |
          rm .github/workflows/apply-tdx-copy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui.ts src/ui.test.ts .github/workflows/apply-tdx-copy.yml
          git commit -m "docs(ui): clarify TDX credential copy"
          git push
