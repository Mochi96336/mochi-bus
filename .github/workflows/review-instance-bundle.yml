name: Review instance change bundle

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type REVIEW to create and verify a non-destructive review artifact
        required: true
        type: string
      config_path:
        description: Repository-relative instance manifest (instance.json or instances/*.json)
        required: true
        type: string
      changes_json:
        description: JSON array of instance:update arguments, excluding workflow control flags
        required: true
        default: '[]'
        type: string
      expected_bundle_hash:
        description: Optional reviewed bundle SHA-256 that must match before artifact creation
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: instance-bundle-review-${{ github.ref }}-${{ inputs.config_path }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Build and verify review artifact
        id: review
        env:
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
          INPUT_CONFIG_PATH: ${{ inputs.config_path }}
          INPUT_CHANGES_JSON: ${{ inputs.changes_json }}
          INPUT_EXPECTED_BUNDLE_HASH: ${{ inputs.expected_bundle_hash }}
        run: node scripts/instance/review-bundle-workflow.mjs
      - name: Upload verified review evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.review.outputs.artifact_name }}
          path: ${{ steps.review.outputs.artifact_directory }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
          include-hidden-files: true
