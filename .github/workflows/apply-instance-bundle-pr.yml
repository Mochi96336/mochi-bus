name: Apply reviewed instance bundle to Draft PR

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type APPLY to atomically apply the reviewed artifact in an isolated branch
        required: true
        type: string
      review_run_id:
        description: Successful Review instance change bundle workflow run ID
        required: true
        type: string
      artifact_name:
        description: Exact instance-bundle-review-* artifact name from that run
        required: true
        type: string
      expected_bundle_hash:
        description: Exact reviewed bundle SHA-256
        required: true
        type: string
      expected_artifact_hash:
        description: Exact reviewed artifact SHA-256
        required: true
        type: string

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: instance-bundle-apply-pr-${{ github.ref }}-${{ inputs.review_run_id }}
  cancel-in-progress: false

jobs:
  apply-to-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - name: Validate immutable apply inputs
        id: preflight
        env:
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
          INPUT_REVIEW_RUN_ID: ${{ inputs.review_run_id }}
          INPUT_ARTIFACT_NAME: ${{ inputs.artifact_name }}
          INPUT_EXPECTED_BUNDLE_HASH: ${{ inputs.expected_bundle_hash }}
          INPUT_EXPECTED_ARTIFACT_HASH: ${{ inputs.expected_artifact_hash }}
        run: node scripts/instance/apply-bundle-pr-workflow.mjs --preflight
      - name: Fetch exact review workflow run metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_RUN_ID: ${{ steps.preflight.outputs.review_run_id }}
        run: |
          set -euo pipefail
          install -d -m 700 .generated
          umask 077
          gh api \
            --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${REVIEW_RUN_ID}" \
            > .generated/apply-review-run.json
      - name: Verify successful review workflow run identity
        env:
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
          INPUT_REVIEW_RUN_ID: ${{ inputs.review_run_id }}
          INPUT_ARTIFACT_NAME: ${{ inputs.artifact_name }}
        run: node scripts/instance/verify-review-run-workflow.mjs
      - name: Download exact review evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.preflight.outputs.artifact_name }}
          path: .generated/apply-input
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.preflight.outputs.review_run_id }}
          digest-mismatch: error
      - name: Atomically apply and verify reviewed manifest
        id: apply
        env:
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
          INPUT_REVIEW_RUN_ID: ${{ inputs.review_run_id }}
          INPUT_ARTIFACT_NAME: ${{ inputs.artifact_name }}
          INPUT_EXPECTED_BUNDLE_HASH: ${{ inputs.expected_bundle_hash }}
          INPUT_EXPECTED_ARTIFACT_HASH: ${{ inputs.expected_artifact_hash }}
        run: node scripts/instance/apply-bundle-pr-workflow.mjs --apply
      - name: Upload apply evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: instance-bundle-apply-${{ steps.apply.outputs.instance_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .generated/apply-input
            .generated/apply-pr
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
          include-hidden-files: true
      - name: Commit only the reviewed manifest on an isolated branch
        id: commit
        shell: bash
        env:
          APPLY_BRANCH: ${{ steps.apply.outputs.branch_name }}
          CONFIG_PATH: ${{ steps.apply.outputs.config_path }}
          COMMIT_MESSAGE: ${{ steps.apply.outputs.commit_message }}
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git check-ref-format --branch "${APPLY_BRANCH}" >/dev/null

          records=()
          while IFS= read -r -d '' record; do
            path="${record:3}"
            if [[ "${path}" == .generated/* ]]; then
              continue
            fi
            records+=("${record}")
          done < <(git -c core.quotePath=false status --porcelain=v1 -z --untracked-files=all)

          if [[ "${#records[@]}" -ne 1 ]]; then
            printf 'Expected exactly one non-generated working-tree change, found %s\n' "${#records[@]}" >&2
            printf '%s\n' "${records[@]}" >&2
            exit 1
          fi

          record="${records[0]}"
          status="${record:0:2}"
          path="${record:3}"
          test "${status}" = " M"
          test "${path}" = "${CONFIG_PATH}"
          git diff --check -- "${CONFIG_PATH}"

          git switch -c "${APPLY_BRANCH}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${CONFIG_PATH}"

          test "$(git diff --cached --name-only --diff-filter=ACMRTUXB)" = "${CONFIG_PATH}"
          if git diff --cached --quiet; then
            echo 'Reviewed manifest produced no staged diff' >&2
            exit 1
          fi
          git commit -m "${COMMIT_MESSAGE}"
          git push --set-upstream origin "${APPLY_BRANCH}"
          echo "commit_sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
      - name: Open Draft PR against the selected source branch
        id: pull_request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APPLY_BRANCH: ${{ steps.apply.outputs.branch_name }}
          BASE_BRANCH: ${{ steps.apply.outputs.base_branch }}
          PR_TITLE: ${{ steps.apply.outputs.pr_title }}
          PR_BODY_PATH: ${{ steps.apply.outputs.pr_body_path }}
        run: |
          set -euo pipefail
          pr_url="$(gh pr create \
            --draft \
            --base "${BASE_BRANCH}" \
            --head "${APPLY_BRANCH}" \
            --title "${PR_TITLE}" \
            --body-file "${PR_BODY_PATH}")"
          printf 'pr_url=%s\n' "${pr_url}" >> "${GITHUB_OUTPUT}"
          printf '\nDraft PR: %s\n' "${pr_url}" >> "${GITHUB_STEP_SUMMARY}"
