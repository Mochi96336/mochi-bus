name: Observability telemetry preflight

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/observability-telemetry-preflight.yml'
      - 'scripts/transit-snapshot/observability-telemetry-preflight.mjs'

concurrency:
  group: observability-telemetry-preflight
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Probe Workers Observability telemetry access
        env:
          CLOUDFLARE_OBSERVABILITY_API_TOKEN: ${{ secrets.CLOUDFLARE_OBSERVABILITY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OBSERVABILITY_TELEMETRY_PREFLIGHT_REPORT: .transit-snapshot/observability-telemetry-preflight.json
        run: node scripts/transit-snapshot/observability-telemetry-preflight.mjs
      - name: Upload bounded telemetry preflight evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: observability-telemetry-preflight
          path: .transit-snapshot/observability-telemetry-preflight.json
          if-no-files-found: warn
          retention-days: 7
