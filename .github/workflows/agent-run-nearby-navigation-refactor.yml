name: Run nearby navigation refactor

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/fix-nearby-auto-preview-back'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - id: guard
        run: |
          if test -f test/e2e/map-auto-preview-navigation.spec.ts; then
            echo 'apply=false' >> "$GITHUB_OUTPUT"
          else
            echo 'apply=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Restore superseded files from main
        if: steps.guard.outputs.apply == 'true'
        run: |
          git fetch origin main
          git checkout origin/main -- \
            web/map/history-state.ts \
            web/map/history-state.test.ts \
            web/map/nearby-results-state.ts \
            web/map/nearby-results-state.test.ts
          git rm -f web/map/nearby-auto-preview-history.ts test/e2e/map-auto-preview-back.spec.ts
      - name: Apply explicit preview-source refactor
        if: steps.guard.outputs.apply == 'true'
        run: |
          python <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/agent-apply-nearby-navigation-refactor.yml').read_text()
          marker = "          python <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          script = dedent(workflow[start:end])
          exec(compile(script, 'nearby-navigation-refactor', 'exec'))
          PY
      - name: Commit refactor
        if: steps.guard.outputs.apply == 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(map): pass explicit nearby preview source"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
