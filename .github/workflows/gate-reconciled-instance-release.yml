name: Gate reconciled instance release

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type ATTEST to create a release-content attestation without deploying
        required: true
        type: string
      reconciliation_run_id:
        description: Successful Reconcile merged reviewed instance bundle PR workflow run ID
        required: true
        type: string
      reconciliation_artifact_name:
        description: Exact instance-bundle-merge-reconciliation-* artifact name from that run
        required: true
        type: string
      expected_release_sha:
        description: Exact 40-character release commit SHA selected for this workflow
        required: true
        type: string
      expected_bundle_hash:
        description: Exact reviewed bundle SHA-256
        required: true
        type: string
      expected_artifact_hash:
        description: Exact reviewed bundle artifact SHA-256
        required: true
        type: string
      expected_target_manifest_hash:
        description: Exact reconciled target manifest SHA-256
        required: true
        type: string
      expected_generated_set_hash:
        description: Exact reconciled generated-set SHA-256
        required: true
        type: string
  workflow_call:
    inputs:
      confirmation:
        description: Exact ATTEST confirmation
        required: true
        type: string
      reconciliation_run_id:
        description: Successful reconciliation workflow run ID
        required: true
        type: string
      reconciliation_artifact_name:
        description: Exact reconciliation artifact name
        required: true
        type: string
      expected_release_sha:
        description: Exact caller release commit SHA
        required: true
        type: string
      expected_bundle_hash:
        description: Exact reviewed bundle SHA-256
        required: true
        type: string
      expected_artifact_hash:
        description: Exact reviewed bundle artifact SHA-256
        required: true
        type: string
      expected_target_manifest_hash:
        description: Exact reconciled target manifest SHA-256
        required: true
        type: string
      expected_generated_set_hash:
        description: Exact reconciled generated-set SHA-256
        required: true
        type: string
    outputs:
      release_content_gate_passed:
        description: Whether exact release content passed the gate
        value: ${{ jobs.release-content-gate.outputs.release_content_gate_passed }}
      attestation_hash:
        description: SHA-256 of the persisted release attestation
        value: ${{ jobs.release-content-gate.outputs.attestation_hash }}
      attestation_artifact_name:
        description: Uploaded release attestation artifact name
        value: ${{ jobs.release-content-gate.outputs.attestation_artifact_name }}

permissions:
  actions: read
  contents: read

concurrency:
  group: instance-release-content-gate-${{ inputs.reconciliation_run_id }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-content-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      release_content_gate_passed: ${{ steps.verify.outputs.release_content_gate_verified }}
      attestation_hash: ${{ steps.attest.outputs.attestation_hash }}
      attestation_artifact_name: ${{ steps.attest.outputs.attestation_artifact_name }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - name: Validate immutable release gate inputs
        id: preflight
        env:
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
          INPUT_RECONCILIATION_RUN_ID: ${{ inputs.reconciliation_run_id }}
          INPUT_RECONCILIATION_ARTIFACT_NAME: ${{ inputs.reconciliation_artifact_name }}
          INPUT_EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha }}
          INPUT_EXPECTED_BUNDLE_HASH: ${{ inputs.expected_bundle_hash }}
          INPUT_EXPECTED_ARTIFACT_HASH: ${{ inputs.expected_artifact_hash }}
          INPUT_EXPECTED_TARGET_MANIFEST_HASH: ${{ inputs.expected_target_manifest_hash }}
          INPUT_EXPECTED_GENERATED_SET_HASH: ${{ inputs.expected_generated_set_hash }}
        run: node scripts/instance/release-attestation.mjs --preflight
      - name: Download exact reconciliation evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.preflight.outputs.reconciliation_artifact_name }}
          path: .generated/release-attestation/reconciliation
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.preflight.outputs.reconciliation_run_id }}
          digest-mismatch: error
      - name: Collect immutable reconciliation-run and live branch evidence
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RECONCILIATION_RUN_ID: ${{ steps.preflight.outputs.reconciliation_run_id }}
          RELEASE_BRANCH: ${{ steps.preflight.outputs.release_branch }}
          RELEASE_SHA: ${{ steps.preflight.outputs.release_sha }}
        with:
          github-token: ${{ github.token }}
          retries: 2
          script: |
            const fs = await import('node:fs/promises')
            const owner = context.repo.owner
            const repo = context.repo.repo
            const repository = `${owner}/${repo}`
            const reconciliationRunId = Number(process.env.RECONCILIATION_RUN_ID)
            const releaseBranch = process.env.RELEASE_BRANCH
            const releaseSha = process.env.RELEASE_SHA
            const root = '.generated/release-attestation/run'
            await fs.mkdir(root, { recursive: true, mode: 0o700 })

            const getBranch = async () => (await github.rest.repos.getBranch({ owner, repo, branch: releaseBranch })).data
            const branchStart = await getBranch()
            if (branchStart.commit.sha !== releaseSha) {
              throw new Error(`Release branch moved before gate evidence collection: expected ${releaseSha}, received ${branchStart.commit.sha}`)
            }
            const run = (await github.rest.actions.getWorkflowRun({ owner, repo, run_id: reconciliationRunId })).data
            const branchEnd = await getBranch()
            if (branchEnd.commit.sha !== branchStart.commit.sha || branchEnd.commit.sha !== releaseSha) {
              throw new Error('Release branch moved while gate evidence was collected')
            }

            const evidence = {
              'branch.json': {
                schemaVersion: 1,
                repository,
                name: releaseBranch,
                sha: branchEnd.commit.sha,
                protected: branchEnd.protected,
              },
              'reconciliation-run.json': {
                schemaVersion: 1,
                repository: run.repository.full_name,
                id: run.id,
                runAttempt: run.run_attempt,
                name: run.name,
                event: run.event,
                status: run.status,
                conclusion: run.conclusion,
                headBranch: run.head_branch,
                headSha: run.head_sha,
                htmlUrl: run.html_url,
              },
            }
            for (const [name, value] of Object.entries(evidence)) {
              await fs.writeFile(`${root}/${name}`, `${JSON.stringify(value, null, 2)}\n`, {
                encoding: 'utf8',
                mode: 0o600,
                flag: 'wx',
              })
            }
      - name: Create exact release-content attestation
        id: attest
        env:
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
          INPUT_RECONCILIATION_RUN_ID: ${{ inputs.reconciliation_run_id }}
          INPUT_RECONCILIATION_ARTIFACT_NAME: ${{ inputs.reconciliation_artifact_name }}
          INPUT_EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha }}
          INPUT_EXPECTED_BUNDLE_HASH: ${{ inputs.expected_bundle_hash }}
          INPUT_EXPECTED_ARTIFACT_HASH: ${{ inputs.expected_artifact_hash }}
          INPUT_EXPECTED_TARGET_MANIFEST_HASH: ${{ inputs.expected_target_manifest_hash }}
          INPUT_EXPECTED_GENERATED_SET_HASH: ${{ inputs.expected_generated_set_hash }}
        run: node scripts/instance/release-attestation.mjs --attest
      - name: Reopen and verify release attestation against checkout
        id: verify
        env:
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
          INPUT_RECONCILIATION_RUN_ID: ${{ inputs.reconciliation_run_id }}
          INPUT_RECONCILIATION_ARTIFACT_NAME: ${{ inputs.reconciliation_artifact_name }}
          INPUT_EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha }}
          INPUT_EXPECTED_BUNDLE_HASH: ${{ inputs.expected_bundle_hash }}
          INPUT_EXPECTED_ARTIFACT_HASH: ${{ inputs.expected_artifact_hash }}
          INPUT_EXPECTED_TARGET_MANIFEST_HASH: ${{ inputs.expected_target_manifest_hash }}
          INPUT_EXPECTED_GENERATED_SET_HASH: ${{ inputs.expected_generated_set_hash }}
          INPUT_EXPECTED_ATTESTATION_HASH: ${{ steps.attest.outputs.attestation_hash }}
        run: node scripts/instance/release-attestation.mjs --verify
      - name: Upload release attestation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.attest.outputs.attestation_artifact_name || format('instance-release-attestation-blocked-{0}-{1}', github.run_id, github.run_attempt) }}
          path: .generated/release-attestation/result
          if-no-files-found: warn
          retention-days: 30
