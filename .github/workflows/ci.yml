name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect browser changes
    runs-on: ubuntu-latest
    outputs:
      browser: ${{ steps.filter.outputs.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect browser-relevant changes
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" != "pull_request" ]]; then
            echo "browser=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          changed_files="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")"
          printf '%s\n' "${changed_files}"

          if grep -Eq '^(src/|web/|public/|test/e2e/|\.github/workflows/ci\.yml$|playwright\.config\.(ts|js|mjs|cjs)$|vite\.config\.(ts|js|mjs|cjs)$|wrangler\.(toml|jsonc?)$|package\.json$|package-lock\.json$)' <<< "${changed_files}"; then
            echo "browser=true" >> "${GITHUB_OUTPUT}"
          else
            echo "browser=false" >> "${GITHUB_OUTPUT}"
          fi

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run quality checks
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee quality-check.log
      - name: Upload quality diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: quality-check-log
          path: |
            quality-check.log
            worker-configuration.d.ts
          if-no-files-found: error
          retention-days: 7
      - name: Commit exact generated Wrangler types to PR head
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          EXPECTED_TYPES_SHA256: efe59a98eaf7f0c93ae54c7deed577b2d6ee59046688faa664e16d253e6af88e
        run: |
          set -euo pipefail
          test -s worker-configuration.d.ts
          actual_sha="$(sha256sum worker-configuration.d.ts | awk '{print $1}')"
          test "${actual_sha}" = "${EXPECTED_TYPES_SHA256}"
          grep -Fq 'Runtime types generated with workerd@1.20260911.1' worker-configuration.d.ts
          if git diff --quiet -- worker-configuration.d.ts; then
            echo 'Generated type file did not change; refusing diagnostic write' >&2
            exit 1
          fi
          current_blob="$(gh api "repos/${GITHUB_REPOSITORY}/contents/worker-configuration.d.ts?ref=${HEAD_REF}" --jq .sha)"
          export CURRENT_BLOB="${current_blob}"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const payload = {
            message: 'chore(types): regenerate Cloudflare bindings for Wrangler 4.131.1',
            content: readFileSync('worker-configuration.d.ts').toString('base64'),
            sha: process.env.CURRENT_BLOB,
            branch: process.env.HEAD_REF,
          }
          writeFileSync('/tmp/update-worker-types.json', JSON.stringify(payload))
          NODE
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/worker-configuration.d.ts" --input /tmp/update-worker-types.json >/tmp/update-result.json
          jq -r '.commit.sha' /tmp/update-result.json

  map-ui:
    name: Map UI regression
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --silent
      - name: Install Chromium
        run: npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Test desktop and touch interaction flows
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/ui
        run: >-
          npx playwright test
          --project=desktop-chromium
          --project=mobile-touch
          --output=test-results/ui
          --reporter=line,html
      - name: Test isolated Worker module state
        env:
          PLAYWRIGHT_WORKER_STATEFUL: '1'
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/stateful
        run: >-
          npx playwright test
          --project=worker-stateful-chromium
          --workers=1
          --output=test-results/stateful
          --reporter=line,html
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: map-ui-playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  visual:
    name: Visual regression
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --silent
      - name: Install Chromium
        run: npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Compare Linux visual snapshots
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/visual
        run: >-
          npx playwright test
          --project=visual-chromium
          --workers=1
          --output=test-results/visual
          --reporter=line,html
      - name: Upload visual diff diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-playwright-report
          path: |
            playwright-report/visual
            test-results/visual
          if-no-files-found: ignore
          retention-days: 7
