name: Snapshot D1 write telemetry canary

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/snapshot-d1-write-canary.yml'
      - 'scripts/transit-snapshot/d1-write-telemetry.mjs'
      - 'scripts/transit-snapshot/install-d1-write-telemetry.mjs'
      - 'scripts/transit-snapshot/summarize-d1-write-telemetry.mjs'

permissions:
  contents: read

concurrency:
  group: transit-snapshot
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Resolve snapshot resources
        id: operation
        run: node scripts/instance/operation-scope.mjs snapshot
      - name: Validate one-shot canary scope
        shell: bash
        env:
          SNAPSHOT_ENABLED: ${{ steps.operation.outputs.enabled }}
          TRANSIT_DATABASE_ID: ${{ steps.operation.outputs.d1_database_id }}
          TRANSIT_R2_BUCKET_NAME: ${{ steps.operation.outputs.r2_bucket_name }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = 'refs/heads/main'
          test "${SNAPSHOT_ENABLED}" = 'true'
          test -n "${TRANSIT_DATABASE_ID}"
          test -n "${TRANSIT_R2_BUCKET_NAME}"
          node scripts/instance/assert-operation-city.mjs Taichung
          echo "SNAPSHOT_WINDOW_DATE=$(TZ=Asia/Taipei date +%F)" >> "${GITHUB_ENV}"
      - name: Preflight snapshot resources
        env:
          MOCHI_BUS_PREFLIGHT_FORCE_ENABLED: 'true'
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          SNAPSHOT_SMOKE_BASE_URL: ${{ steps.operation.outputs.public_origin || vars.SNAPSHOT_SMOKE_BASE_URL }}
        run: npm run instance:preflight -- snapshot
      - name: Apply transit database migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx wrangler d1 migrations apply
          "${{ steps.operation.outputs.d1_database_name }}"
          --remote
          --config .generated/instance/wrangler.instance.jsonc
      - name: Run non-forced Taichung publication canary
        id: publish
        shell: bash
        env:
          NODE_OPTIONS: --import=./scripts/transit-snapshot/install-d1-write-telemetry.mjs
          SNAPSHOT_D1_WRITE_TELEMETRY: '1'
          SNAPSHOT_D1_WRITE_TELEMETRY_CITY: Taichung
          SNAPSHOT_D1_WRITE_TELEMETRY_FILE: snapshot-d1-write-telemetry.jsonl
          SNAPSHOT_WINDOW_TYPE: manual
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TRANSIT_D1_DATABASE_NAME: ${{ steps.operation.outputs.d1_database_name }}
          TRANSIT_DATABASE_ID: ${{ steps.operation.outputs.d1_database_id }}
          TRANSIT_R2_BUCKET_NAME: ${{ steps.operation.outputs.r2_bucket_name }}
          SNAPSHOT_SMOKE_BASE_URL: ${{ steps.operation.outputs.public_origin || vars.SNAPSHOT_SMOKE_BASE_URL }}
          SNAPSHOT_D1_WRITE_BUDGET: '75000'
          SNAPSHOT_D1_WRITE_BUDGET_FILE: .transit-snapshot/d1-write-budget-canary.json
          SNAPSHOT_D1_ESTIMATE_GROWTH_FACTOR: '1.10'
        run: |
          set -uo pipefail
          set +e
          npm run snapshot:window -- Taichung 2>&1 | tee snapshot-d1-write-canary.log
          status=${PIPESTATUS[0]}
          set -e
          echo "publisher_status=${status}" >> "${GITHUB_OUTPUT}"
          exit 0
      - name: Build bounded D1 write evidence
        if: always()
        run: >-
          node scripts/transit-snapshot/summarize-d1-write-telemetry.mjs
          snapshot-d1-write-canary.log
          snapshot-d1-write-telemetry.jsonl
          snapshot-d1-write-evidence.json
      - name: Upload D1 write evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snapshot-d1-write-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            snapshot-d1-write-canary.log
            snapshot-d1-write-evidence.json
            snapshot-d1-write-telemetry.jsonl
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
      - name: Enforce publisher result
        if: always()
        shell: bash
        env:
          PUBLISHER_STATUS: ${{ steps.publish.outputs.publisher_status }}
        run: |
          set -euo pipefail
          test "${PUBLISHER_STATUS}" = '0'
          test -s snapshot-d1-write-evidence.json
      - name: Cleanup canary workspace
        if: always()
        run: rm -rf .transit-snapshot snapshot-d1-write-canary.log snapshot-d1-write-evidence.json snapshot-d1-write-telemetry.jsonl
