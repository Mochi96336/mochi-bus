name: Apply staged map navigation fix

on:
  push:
    branches:
      - agent/fix-map-drawer-navigation

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/fix-map-drawer-navigation
          fetch-depth: 0
      - name: Apply navigation patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/agent-fix-map-drawer.patch
          git apply .github/agent-fix-map-drawer.patch
          rm .github/agent-fix-map-drawer.patch
          rm .github/workflows/agent-apply-map-navigation.yml
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Validate focused changes
        shell: bash
        run: |
          set -o pipefail
          {
            npm ci --silent
            npm test -- web/map/main-size.test.ts web/map/nearby-places-controller.test.ts
            npm run typecheck
            npm run build:map
          } 2>&1 | tee agent-check.log
      - name: Commit applied fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(map): stabilize drawer navigation"
          git push origin HEAD:agent/fix-map-drawer-navigation
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: agent-map-navigation-check
          path: agent-check.log
          if-no-files-found: ignore
          retention-days: 3
