name: Instance apply platform

on:
  pull_request:
    paths:
      - scripts/instance/apply-bundle.mjs
      - scripts/instance/apply-bundle-recovery.test.mjs
      - scripts/instance/atomic-manifest-write.mjs
      - .github/workflows/instance-apply-platform.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instance-apply-platform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  filesystem:
    name: Filesystem semantics (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --silent
      - name: Test reviewed apply filesystem recovery
        run: npx vitest run scripts/instance/apply-bundle-recovery.test.mjs
