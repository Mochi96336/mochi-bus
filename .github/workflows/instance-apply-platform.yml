name: Instance apply platform

on:
  pull_request:
    paths:
      - scripts/instance/apply-bundle.mjs
      - scripts/instance/apply-bundle-recovery.test.mjs
      - scripts/instance/atomic-manifest-write.mjs
      - .github/workflows/instance-apply-platform.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instance-apply-platform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  filesystem:
    name: Filesystem semantics (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --silent
      - name: Test reviewed apply filesystem recovery
        run: npx vitest run scripts/instance/apply-bundle-recovery.test.mjs
