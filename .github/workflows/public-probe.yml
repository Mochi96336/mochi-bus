name: Public network probe

on:
  schedule:
    # 08:20 Asia/Taipei, after the 07:45 snapshot window watchdog. Taiwan has
    # no daylight-saving time.
    - cron: '20 0 * * *'
  workflow_dispatch:

concurrency:
  group: public-network-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Resolve public probe scope
        id: operation
        run: node scripts/instance/operation-scope.mjs publicProbe
      - name: Preflight public probe resources
        if: steps.operation.outputs.enabled == 'true'
        run: npm run instance:preflight -- publicProbe
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SNAPSHOT_SMOKE_BASE_URL: ${{ steps.operation.outputs.public_origin || vars.SNAPSHOT_SMOKE_BASE_URL }}
      - name: Apply transit database migrations
        if: steps.operation.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx wrangler d1 migrations apply
          "${{ steps.operation.outputs.d1_database_name }}"
          --remote
          --config .generated/instance/wrangler.instance.jsonc
      - name: Probe the public surface for every enabled city
        if: steps.operation.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TRANSIT_DATABASE_ID: ${{ steps.operation.outputs.d1_database_id }}
          SNAPSHOT_SMOKE_BASE_URL: ${{ steps.operation.outputs.public_origin || vars.SNAPSHOT_SMOKE_BASE_URL }}
        run: npm run snapshot:public-probe
