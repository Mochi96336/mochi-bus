name: Instance provisioning plan

on:
  workflow_dispatch:
    inputs:
      remote:
        description: Verify generated D1 and R2 identity through read-only Cloudflare API requests
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  plan:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      MOCHI_BUS_INSTANCE_CONFIG: ${{ vars.MOCHI_BUS_INSTANCE_CONFIG }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .nvmrc

      - name: Generate non-destructive provisioning plan
        if: ${{ !inputs.remote }}
        env:
          CLOUDFLARE_DEPLOY_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN != '' && 'configured' || '' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && 'configured' || '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' && '00000000000000000000000000000000' || '' }}
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID != '' && 'configured' || '' }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET != '' && 'configured' || '' }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID != '' && 'configured' || '' }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY != '' && 'configured' || '' }}
          SNAPSHOT_SMOKE_BASE_URL: ${{ vars.SNAPSHOT_SMOKE_BASE_URL }}
          RELEASE_SMOKE_ORIGIN: ${{ vars.RELEASE_SMOKE_ORIGIN }}
        run: |
          args=(--github-summary)
          if [[ "${{ inputs.remote }}" == "true" ]]; then
            args+=(--remote)
          fi
          npm run instance:provision-plan -- "${args[@]}"

      - name: Generate non-destructive provisioning plan with remote verification
        if: ${{ inputs.remote }}
        env:
          CLOUDFLARE_DEPLOY_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN != '' && 'configured' || '' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID != '' && 'configured' || '' }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET != '' && 'configured' || '' }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID != '' && 'configured' || '' }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY != '' && 'configured' || '' }}
          SNAPSHOT_SMOKE_BASE_URL: ${{ vars.SNAPSHOT_SMOKE_BASE_URL }}
          RELEASE_SMOKE_ORIGIN: ${{ vars.RELEASE_SMOKE_ORIGIN }}
        run: |
          args=(--github-summary)
          if [[ "${{ inputs.remote }}" == "true" ]]; then
            args+=(--remote)
          fi
          npm run instance:provision-plan -- "${args[@]}"
