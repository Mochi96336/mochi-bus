name: Snapshot window watchdog

on:
  schedule:
    # 07:45 Asia/Taipei. Taiwan has no daylight-saving time.
    - cron: '45 23 * * *'
  workflow_dispatch:

concurrency:
  group: snapshot-window-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Resolve watchdog scope
        id: operation
        run: node scripts/instance/operation-scope.mjs windowWatchdog
      - name: Preflight watchdog resources
        if: steps.operation.outputs.enabled == 'true'
        run: npm run instance:preflight -- windowWatchdog
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply transit database migrations
        if: steps.operation.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx wrangler d1 migrations apply
          "${{ steps.operation.outputs.d1_database_name }}"
          --remote
          --config .generated/instance/wrangler.instance.jsonc
      - name: Evaluate closed snapshot windows
        if: steps.operation.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TRANSIT_DATABASE_ID: ${{ steps.operation.outputs.d1_database_id }}
        run: npm run snapshot:watchdog
